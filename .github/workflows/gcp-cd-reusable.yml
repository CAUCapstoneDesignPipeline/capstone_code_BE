name: Automatic GCP app release
'on':
  workflow_call:
    inputs:
      component: {required: true, type: string}
      operation: {required: true, type: string}
      source_sha: {required: true, type: string}
      image_digest: {required: true, type: string}
      deploy_tool_sha: {required: true, type: string}
    outputs:
      operation_id:
        value: ${{ jobs.release.outputs.operation_id }}
      release_id:
        value: ${{ jobs.release.outputs.release_id }}
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    # BE and FE share the app VM; the host serializes operations and rejects a stale expected release.
    concurrency:
      group: gcp-app-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      operation_id: ${{ steps.execute.outputs.operation_id }}
      release_id: ${{ steps.execute.outputs.release_id }}
    env:
      COMPONENT: ${{ inputs.component }}
      OPERATION: ${{ inputs.operation }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      DEPLOY_TOOL_SHA: ${{ inputs.deploy_tool_sha }}
      GCP_DEPLOY_ENABLED: ${{ vars.GCP_DEPLOY_ENABLED }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
    steps:
    - name: Validate approved tool pin before checkout
      env:
        APPROVED_TOOL_SHA: ${{ vars.GCP_CD_TOOL_SHA }}
      run: |-
        python3 - <<'PYCODE'
        import os,re
        expected=os.environ['APPROVED_TOOL_SHA']
        if not re.fullmatch('[a-f0-9]{40}',expected) or expected!=os.environ['DEPLOY_TOOL_SHA']:
            raise SystemExit('Tool SHA must match the production environment pin')
        PYCODE
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: CAUCapstoneDesignPipeline/capstone_code_BE
        ref: ${{ inputs.deploy_tool_sha }}
        persist-credentials: false
    - name: Check out the pushed BE source for its migration inventory
      if: inputs.component == 'be' && inputs.operation == 'deploy'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: CAUCapstoneDesignPipeline/capstone_code_BE
        ref: ${{ inputs.source_sha }}
        path: source
        persist-credentials: false
    - name: Validate canonical caller and inputs before cloud authentication
      run: python3 deploy/gcp/auto.py validate
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        create_credentials_file: true
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - name: Derive from the recorded release, submit and observe
      id: execute
      run: python3 deploy/gcp/auto.py
