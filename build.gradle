plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.example'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations { uploadValidation }

// Spring AI 2.0.2 POMs declare Boot 4.1.2, Spring Framework 7.0.10, Jackson 3.1.7 and Micrometer 1.17.2.
// Keep those version-aligned families on the Boot 4.1.1 BOM so no family ends up with mixed patch versions.
def bootVersion = org.springframework.boot.gradle.plugin.SpringBootPlugin.package.implementationVersion
def bootBomFile = configurations.detachedConfiguration(
        dependencies.create("org.springframework.boot:spring-boot-dependencies:${bootVersion}@pom")).singleFile
def bootBom = new groovy.xml.XmlSlurper().parse(bootBomFile).properties
def alignedFamilies = [
        'org.springframework.boot': bootVersion,
        'org.springframework': bootBom.'spring-framework.version'.text(),
        'tools.jackson.core': bootBom.'jackson-bom.version'.text(),
        'tools.jackson.dataformat': bootBom.'jackson-bom.version'.text(),
        'tools.jackson': bootBom.'jackson-bom.version'.text(),
        'io.micrometer': bootBom.'micrometer.version'.text(),
]
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        def version = alignedFamilies[details.requested.group]
        boolean micrometerModule = details.requested.group != 'io.micrometer' || details.requested.name.startsWith('micrometer-')
        if (version && micrometerModule && details.requested.name != 'spring-boot-dependencies') {
            details.useVersion(version)
            details.because('keep Spring AI transitive versions on the Spring Boot BOM')
        }
    }
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    // Spring AI 2.0.x supports Boot 4.0.x/4.1.x; not managed by the Boot BOM. Used only for the MCP server.
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    uploadValidation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    // Spring Boot 4 support; springdoc is not managed by the Boot BOM.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Explicit local compatibility probe. Requires a private synthetic-only configuration file.
tasks.register('aiCompatibilitySmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.capstone.analysis.AiCompatibilitySmoke'
}

// 별도 경량 validator jar. 앱 bootJar wildcard와 충돌하지 않는 경로를 사용한다.
tasks.register('uploadValidatorJar', Jar) {
    dependsOn classes
    archiveFileName = 'upload-validator.jar'
    destinationDirectory = layout.buildDirectory.dir('validation')
    manifest { attributes 'Main-Class': 'com.example.capstone.conversion.validation.UploadValidatorMain' }
    from(sourceSets.main.output) { include 'com/example/capstone/conversion/validation/**' }
    from { configurations.uploadValidation.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.named('bootJar') { dependsOn uploadValidatorJar }
tasks.named('test') { dependsOn uploadValidatorJar; systemProperty 'capstone.test.validator-jar', layout.buildDirectory.file('validation/upload-validator.jar').get().asFile.absolutePath }
