spring:
  application:
    name: capstone-be
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

capstone:
  ai:
    enabled: ${CAPSTONE_AI_ENABLED:false}
    pipeline:
      policy-file: ${CAPSTONE_AI_POLICY_FILE:}
      attestation-file: ${CAPSTONE_AI_ATTESTATION_FILE:}
      attestation-sha256: ${CAPSTONE_AI_ATTESTATION_SHA256:}
      synthetic-stub: ${CAPSTONE_AI_SYNTHETIC_STUB:false}
    execution:
      worker-enabled: ${CAPSTONE_AI_WORKER_ENABLED:true}
      budget-microunits: ${CAPSTONE_AI_BUDGET_MICROUNITS:0}
      currency: ${CAPSTONE_AI_CURRENCY:}
    client:
      base-url: ${CAPSTONE_AI_BASE_URL:}
      service-token: ${CAPSTONE_AI_SERVICE_TOKEN:}
      ca-certificate: ${CAPSTONE_AI_CA_CERTIFICATE:}
  auth:
    app-url: ${CAPSTONE_APP_URL:http://localhost:5173}
    allowed-emails: ${CAPSTONE_ALLOWED_EMAILS:}
    google:
      enabled: ${CAPSTONE_GOOGLE_ENABLED:false}
      client-id: ${CAPSTONE_GOOGLE_CLIENT_ID:}
      client-secret: ${CAPSTONE_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${CAPSTONE_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    dev-token:
      enabled: ${CAPSTONE_DEV_TOKEN_ENABLED:false}
    jwt:
      secret: ${CAPSTONE_JWT_SECRET:}
      issuer: capstone-be

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
