spring:
  application:
    name: capstone-be
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

capstone:
  auth:
    app-url: ${CAPSTONE_APP_URL:http://localhost:5173}
    dev-token:
      enabled: ${CAPSTONE_DEV_TOKEN_ENABLED:false}
    jwt:
      secret: ${CAPSTONE_JWT_SECRET:}
      issuer: capstone-be

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
