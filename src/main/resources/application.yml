spring:
  application:
    name: capstone-be
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

capstone:
  conversion:
    enabled: ${CAPSTONE_CONVERSION_ENABLED:false}
    storage-root: ${CAPSTONE_CONVERSION_STORAGE_ROOT:}
    validator-jar: ${CAPSTONE_CONVERSION_VALIDATOR_JAR:}
    validation-seconds: ${CAPSTONE_CONVERSION_VALIDATION_SECONDS:20}
    call-seconds: ${CAPSTONE_CONVERSION_CALL_SECONDS:120}
    worker-enabled: ${CAPSTONE_CONVERSION_WORKER_ENABLED:false}
    budget-microunits: ${CAPSTONE_CONVERSION_BUDGET_MICROUNITS:0}
    currency: ${CAPSTONE_CONVERSION_CURRENCY:}
  ai:
    enabled: ${CAPSTONE_AI_ENABLED:false}
    runtime:
      release-authorized: ${CAPSTONE_AI_RELEASE_AUTHORIZED:false}
      suspension-file: ${CAPSTONE_AI_SUSPENSION_FILE:}
    pipeline:
      policy-file: ${CAPSTONE_AI_POLICY_FILE:}
      attestation-file: ${CAPSTONE_AI_ATTESTATION_FILE:}
      attestation-sha256: ${CAPSTONE_AI_ATTESTATION_SHA256:}
      synthetic-stub: ${CAPSTONE_AI_SYNTHETIC_STUB:false}
    execution:
      worker-enabled: ${CAPSTONE_AI_WORKER_ENABLED:true}
      budget-microunits: ${CAPSTONE_AI_BUDGET_MICROUNITS:0}
      currency: ${CAPSTONE_AI_CURRENCY:}
    client:
      base-url: ${CAPSTONE_AI_BASE_URL:}
      service-token: ${CAPSTONE_AI_SERVICE_TOKEN:}
      ca-certificate: ${CAPSTONE_AI_CA_CERTIFICATE:}
  auth:
    app-url: ${CAPSTONE_APP_URL:http://localhost:5173}
    allowed-emails: ${CAPSTONE_ALLOWED_EMAILS:}
    google:
      enabled: ${CAPSTONE_GOOGLE_ENABLED:false}
      client-id: ${CAPSTONE_GOOGLE_CLIENT_ID:}
      client-secret: ${CAPSTONE_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${CAPSTONE_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    dev-token:
      enabled: ${CAPSTONE_DEV_TOKEN_ENABLED:false}
    jwt:
      secret: ${CAPSTONE_JWT_SECRET:}
      issuer: capstone-be

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

# 제약 위반 로그의 DB 행/원문 출력을 차단합니다. 오류 응답은 공통 처리기가 담당합니다.
logging:
  level:
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

# 선택적 업로드/변환 설정: 미설정 상태에서도 기존 CRUD를 제공한다.
